[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --strict-markers
norecursedirs = __pycache__ .pytest_cache
markers =
    tier1: Tier 1 feature coverage
    tier2: Tier 2 boundary & corner cases
    tier3: Tier 3 pairwise cross-feature combinations
    tier4: Tier 4 end-to-end browser journeys
    expects_m1: Expected to pass after Milestone 1 fixes
    expects_m2: Expected to pass after Milestone 2 fixes
    expects_m3: Expected to pass after Milestone 3 fixes
    py_parity: Optional parity checks against local server.py
