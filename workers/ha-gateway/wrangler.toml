name = "watchlivo-ha-gateway"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = false

routes = [
  { pattern = "watchlivo.online/*", zone_name = "watchlivo.online" },
  { pattern = "www.watchlivo.online/*", zone_name = "watchlivo.online" }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "WATCHLIVO_KV"
id = "1823a59b725f46879dc5b3bf19a4d93e"

[[durable_objects.bindings]]
name = "ROOM_DO"
class_name = "WatchlivoRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchlivoRoomDO"]

[triggers]
crons = ["*/10 * * * *"]

[vars]
SECONDARY_ORIGIN = "https://watchlivo-origin-eu.onrender.com"
FORCE_SECONDARY = "1"
