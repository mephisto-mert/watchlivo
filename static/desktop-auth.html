<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watchlivo — Masaüstü Girişi</title>
  <link rel="icon" href="/static/watchlivo-logo.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #07080d;
      --card: rgba(18, 20, 32, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --neon: #00f5d4;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 20%, #151828 0%, #07080d 80%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 30px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(0, 245, 212, 0.06);
      backdrop-filter: blur(20px);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .logo-badge img { width: 38px; height: 38px; }
    .logo-badge span { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.5px; }
    .logo-badge span em { color: var(--neon); font-style: normal; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    p.desc { font-size: 0.9rem; color: var(--muted); line-height: 1.5; margin-bottom: 24px; }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 20px;
      background: #ffffff;
      color: #1f2937;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .btn-google:hover {
      background: #f1f5f9;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    .status-box {
      margin-top: 20px;
      font-size: 0.88rem;
      min-height: 24px;
      transition: all 0.3s;
    }
    .status-ok { color: var(--neon); font-weight: 600; }
    .status-err { color: #f43f5e; }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0, 245, 212, 0.3);
      border-top-color: var(--neon);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="logo-badge">
      <img src="/static/watchlivo-logo.svg" alt="Watchlivo" />
      <span>Watch<em>livo</em></span>
    </div>
    <h1>Masaüstü Uygulaması Girişi</h1>
    <p class="desc">Google hesabınızı seçerek Watchlivo masaüstü uygulamasına tek tıkla bağlanın.</p>
    <button id="google-btn" class="btn-google">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.2-.9 2.3-2 3l3.2 2.5c1.9-1.7 3-4.3 3-7.4 0-.7-.1-1.4-.2-2H12z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.4l-3.2-2.5c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.9v2.6C4.6 19.8 8 22 12 22z"/><path fill="#FBBC05" d="M6.2 13.8c-.2-.6-.3-1.2-.3-1.8s.1-1.2.3-1.8V7.6H2.9C2.3 8.9 2 10.4 2 12s.3 3.1.9 4.4l3.3-2.6z"/><path fill="#4285F4" d="M12 5.9c1.5 0 2.8.5 3.9 1.5l2.9-2.9C17 2.9 14.7 2 12 2 8 2 4.6 4.2 2.9 7.6l3.3 2.6c.8-2.5 3.1-4.3 5.8-4.3z"/></svg>
      <span>Google ile Giriş Yap</span>
    </button>
    <div id="status" class="status-box"></div>
  </div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const port = params.get('port') || '49223';
    const state = params.get('state') || '';
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('google-btn');

    function setStatus(html, type = '') {
      statusEl.className = 'status-box ' + (type ? 'status-' + type : '');
      statusEl.innerHTML = html;
    }

    const FIREBASE_CONFIG = {
      apiKey: 'AIzaSyAeyDRstvjN8c_D08U8CrqopcFT0_fz9fo',
      authDomain: 'watchlivo-38ab6.firebaseapp.com',
      projectId: 'watchlivo-38ab6',
      appId: '1:1034129375158:web:6ce9d8f15e625925090b17',
    };

    async function sendToDesktop(user, authToken) {
      setStatus('<span class="spinner"></span> Masaüstü uygulamasına aktarılıyor...');
      try {
        const res = await fetch(`http://127.0.0.1:${port}/callback`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ state, user, authToken })
        });
        const json = await res.json();
        if (json.ok) {
          setStatus('✓ Giriş Başarılı! Masaüstü uygulaması açıldı.<br>Bu sekmeyi kapatabilirsiniz.', 'ok');
          btn.style.display = 'none';
          setTimeout(() => window.close(), 2500);
        } else {
          setStatus('Aktarım hatası: ' + (json.error || 'Bilinmeyen hata'), 'err');
        }
      } catch (e) {
        setStatus('Masaüstü uygulamasına ulaşılamadı. Uygulamanın açık olduğundan emin olun.', 'err');
      }
    }

    // Auto-check if already logged in on web
    try {
      const saved = JSON.parse(localStorage.getItem('vortex_profile_v2') || 'null');
      if (saved && saved.authToken && saved.name && !saved.isGuest) {
        setStatus(`Mevcut hesabınız: <strong>${saved.name}</strong> (@${saved.handle})<br><span class="spinner"></span> Oturum aktarılıyor...`);
        sendToDesktop(saved, saved.authToken);
      }
    } catch (_) {}

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      setStatus('<span class="spinner"></span> Google penceresi açılıyor...');
      try {
        const [{ initializeApp, getApps }, { getAuth, GoogleAuthProvider, signInWithPopup }] = await Promise.all([
          import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
          import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),
        ]);
        const app = getApps().length ? getApps()[0] : initializeApp(FIREBASE_CONFIG);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const cred = await signInWithPopup(auth, provider);
        if (!cred?.user) throw new Error('Google girişi tamamlanmadı.');

        setStatus('<span class="spinner"></span> Hesap doğrulanıyor...');
        const idToken = await cred.user.getIdToken();
        const apiRes = await fetch('/api/auth/oauth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            provider: 'google',
            idToken,
            email: cred.user.email || '',
            name: cred.user.displayName || 'Google Üyesi'
          })
        });
        const data = await apiRes.json();
        if (!data.ok || !data.user) throw new Error(data.error || 'Sunucu doğrulaması başarısız.');

        localStorage.setItem('vortex_profile_v2', JSON.stringify({ ...data.user, authToken: data.authToken, isGuest: false, verified: true }));
        await sendToDesktop(data.user, data.authToken);
      } catch (err) {
        btn.disabled = false;
        setStatus(err.message || 'Giriş yapılamadı.', 'err');
      }
    });
  </script>
</body>
</html>
